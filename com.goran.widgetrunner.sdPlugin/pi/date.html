<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Date settings</title>
<style>
  body { font-family: system-ui, sans-serif; font-size: 13px; color: #ddd; background: transparent; margin: 8px; }
  label { display: block; margin-bottom: 4px; color: #aaa; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 4px; border: 1px solid #555;
          background: #2a2a2a; color: #eee; font-size: 13px; }
  .hint { margin-top: 6px; color: #777; font-size: 11px; line-height: 1.4; }
  code { color: #9ab; }
</style>
</head>
<body>
  <label for="open_target">Open on press</label>
  <input id="open_target" type="text" placeholder="(default: One Calendar, then Windows Calendar)" autocomplete="off">
  <div class="hint">
    Anything Windows can open: an <code>.exe</code> or <code>.lnk</code> path, a URL, a URI like
    <code>outlookcal:</code> or <code>onecalendar:</code>, or a Store app as
    <code>shell:AppsFolder\&lt;AppUserModelId&gt;</code>. Leave empty for the default.
  </div>

<script>
  let ws = null, ctx = null, settings = {};
  const input = document.getElementById("open_target");

  function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
    ctx = uuid;
    try { settings = JSON.parse(actionInfo).payload.settings || {}; } catch (e) { settings = {}; }
    input.value = settings.open_target || "";
    ws = new WebSocket("ws://127.0.0.1:" + port);
    ws.onopen = () => ws.send(JSON.stringify({ event: registerEvent, uuid }));
  }

  let timer = null;
  input.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(save, 600); });
  input.addEventListener("change", save);

  function save() {
    if (!ws || ws.readyState !== 1) return;
    settings.open_target = input.value.trim();
    ws.send(JSON.stringify({ event: "setSettings", context: ctx, payload: settings }));
  }
</script>
</body>
</html>
