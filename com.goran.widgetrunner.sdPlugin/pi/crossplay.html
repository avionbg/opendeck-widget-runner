<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Find on Spotify / YouTube</title>
<style>
  body { font-family: system-ui, sans-serif; font-size: 13px; color: #ddd; background: transparent; margin: 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row span { width: 120px; color: #aaa; }
  select { padding: 5px 8px; border-radius: 4px; border: 1px solid #555; background: #2a2a2a; color: #eee; font-size: 13px; }
  label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .hint { margin-top: 4px; color: #777; font-size: 11px; line-height: 1.4; }
</style>
</head>
<body>
  <div class="row"><span>Search on</span>
    <select id="target"><option value="auto">Auto (the other platform)</option><option value="spotify">Always Spotify</option><option value="youtube">Always YouTube</option></select></div>
  <div class="row"><label><input id="spotify_app" type="checkbox"> Open the Spotify desktop app instead of the web player</label></div>
  <div class="hint">Auto: playing from Spotify searches YouTube, playing from a browser searches Spotify.</div>
<script>
  let ws = null, ctx = null, settings = {};
  const target = document.getElementById("target"), app = document.getElementById("spotify_app");
  function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
    ctx = uuid;
    try { settings = JSON.parse(actionInfo).payload.settings || {}; } catch (e) { settings = {}; }
    target.value = settings.target || "auto";
    app.checked = !!settings.spotify_app;
    ws = new WebSocket("ws://127.0.0.1:" + port);
    ws.onopen = () => ws.send(JSON.stringify({ event: registerEvent, uuid }));
  }
  function save() {
    if (!ws || ws.readyState !== 1) return;
    settings.target = target.value; settings.spotify_app = app.checked;
    ws.send(JSON.stringify({ event: "setSettings", context: ctx, payload: settings }));
  }
  target.addEventListener("change", save); app.addEventListener("change", save);
</script>
</body>
</html>
