<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Exchange rate settings</title>
<style>
  body { font-family: system-ui, sans-serif; font-size: 13px; color: #ddd; background: transparent; margin: 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row span { width: 60px; color: #aaa; }
  input { width: 80px; padding: 5px 8px; border-radius: 4px; border: 1px solid #555; background: #2a2a2a; color: #eee;
          font-size: 13px; text-transform: uppercase; }
  .hint { margin-top: 4px; color: #777; font-size: 11px; line-height: 1.4; }
</style>
</head>
<body>
  <div class="row"><span>From</span><input id="base" maxlength="3" placeholder="EUR"></div>
  <div class="row"><span>To</span><input id="quote" maxlength="3" placeholder="RSD"></div>
  <div class="hint">ISO codes (EUR, USD, RSD, CHF, GBP, …). Rates update once a day; press the key to open Google Finance.</div>

<script>
  let ws = null, ctx = null, settings = {};
  const base = document.getElementById("base"), quote = document.getElementById("quote");

  function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
    ctx = uuid;
    try { settings = JSON.parse(actionInfo).payload.settings || {}; } catch (e) { settings = {}; }
    base.value = settings.base || "";
    quote.value = settings.quote || "";
    ws = new WebSocket("ws://127.0.0.1:" + port);
    ws.onopen = () => ws.send(JSON.stringify({ event: registerEvent, uuid }));
  }

  function save() {
    if (!ws || ws.readyState !== 1) return;
    settings.base = base.value.trim().toUpperCase();
    settings.quote = quote.value.trim().toUpperCase();
    ws.send(JSON.stringify({ event: "setSettings", context: ctx, payload: settings }));
  }
  [base, quote].forEach(el => el.addEventListener("change", save));
</script>
</body>
</html>
