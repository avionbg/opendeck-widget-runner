<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Spectrum settings</title>
<style>
  body { font-family: system-ui, sans-serif; font-size: 13px; color: #ddd; background: transparent; margin: 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row span { width: 110px; color: #aaa; }
  input[type=number], select { padding: 5px 8px; border-radius: 4px; border: 1px solid #555; background: #2a2a2a; color: #eee; font-size: 13px; }
  input[type=number] { width: 70px; }
  label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .hint { margin-top: 4px; color: #777; font-size: 11px; line-height: 1.4; }
</style>
</head>
<body>
  <div class="row"><span>Bands</span>
    <select id="bands"><option value="16">16</option><option value="24">24</option><option value="32">32</option><option value="48">48</option></select></div>
  <div class="row"><span>Range (dB)</span><input id="range_db" type="number" min="30" max="90" step="5" placeholder="60"></div>
  <div class="row"><label><input id="caps" type="checkbox"> Peak caps</label></div>
  <div class="hint">Bass on the left, treble on the right (40 Hz – 16 kHz, log scale). Lower range = more sensitive.
  Pressing the key toggles between 60 and 45 dB.</div>
<script>
  let ws = null, ctx = null, settings = {};
  const bands = document.getElementById("bands"), range = document.getElementById("range_db"), caps = document.getElementById("caps");
  function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
    ctx = uuid;
    try { settings = JSON.parse(actionInfo).payload.settings || {}; } catch (e) { settings = {}; }
    bands.value = String(settings.bands || 24);
    range.value = settings.range_db || "";
    caps.checked = settings.caps === undefined ? true : !!settings.caps;
    ws = new WebSocket("ws://127.0.0.1:" + port);
    ws.onopen = () => ws.send(JSON.stringify({ event: registerEvent, uuid }));
  }
  function save() {
    if (!ws || ws.readyState !== 1) return;
    settings.bands = Number(bands.value);
    settings.range_db = range.value ? Number(range.value) : undefined;
    settings.caps = caps.checked;
    ws.send(JSON.stringify({ event: "setSettings", context: ctx, payload: settings }));
  }
  [bands, range, caps].forEach(el => el.addEventListener("change", save));
</script>
</body>
</html>
