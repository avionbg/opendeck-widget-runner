<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sleep timer settings</title>
<style>
  body { font-family: system-ui, sans-serif; font-size: 13px; color: #ddd; background: transparent; margin: 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row span { width: 140px; color: #aaa; }
  input { width: 110px; padding: 5px 8px; border-radius: 4px; border: 1px solid #555; background: #2a2a2a; color: #eee; font-size: 13px; }
  .hint { margin-top: 4px; color: #777; font-size: 11px; line-height: 1.4; }
</style>
</head>
<body>
  <div class="row"><span>Durations (min)</span><input id="durations" type="text"  placeholder="15, 30, 60"></div>
  <div class="hint">Comma separated. Each press moves to the next duration, then off. Dial: ±5 min, press cancels. When it runs out, playback is paused.</div>
<script>
  let ws = null, ctx = null, settings = {};
  const el = document.getElementById("durations");
  function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
    ctx = uuid;
    try { settings = JSON.parse(actionInfo).payload.settings || {}; } catch (e) { settings = {}; }
    el.value = settings["durations"] ?? "";
    ws = new WebSocket("ws://127.0.0.1:" + port);
    ws.onopen = () => ws.send(JSON.stringify({ event: registerEvent, uuid }));
  }
  el.addEventListener("change", () => {
    if (!ws || ws.readyState !== 1) return;
    settings["durations"] = el.value === "" ? undefined : (el.type === "number" ? Number(el.value) : el.value);
    ws.send(JSON.stringify({ event: "setSettings", context: ctx, payload: settings }));
  });
</script>
</body>
</html>
