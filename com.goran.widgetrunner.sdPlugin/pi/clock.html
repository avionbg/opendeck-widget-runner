<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Clock settings</title>
<style>
  body { font-family: system-ui, sans-serif; font-size: 13px; color: #ddd; background: transparent; margin: 8px; }
  .row { display: flex; gap: 16px; align-items: center; }
  label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .hint { margin-top: 6px; color: #777; font-size: 11px; line-height: 1.4; }
</style>
</head>
<body>
  <div class="row">
    <span style="color:#aaa">Style</span>
    <label><input type="radio" name="mode" value="analog"> Analog</label>
    <label><input type="radio" name="mode" value="digital"> Digital</label>
  </div>
  <div class="hint">Analog: the time is the key title, so title font/size/position settings apply.
  Digital: hours and minutes large, seconds below.</div>

<script>
  let ws = null, ctx = null, settings = {};
  const radios = document.querySelectorAll('input[name="mode"]');

  function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
    ctx = uuid;
    try { settings = JSON.parse(actionInfo).payload.settings || {}; } catch (e) { settings = {}; }
    const mode = settings.mode || "analog";
    radios.forEach(r => r.checked = (r.value === mode));
    ws = new WebSocket("ws://127.0.0.1:" + port);
    ws.onopen = () => ws.send(JSON.stringify({ event: registerEvent, uuid }));
  }

  radios.forEach(r => r.addEventListener("change", () => {
    if (!ws || ws.readyState !== 1 || !r.checked) return;
    settings.mode = r.value;
    ws.send(JSON.stringify({ event: "setSettings", context: ctx, payload: settings }));
  }));
</script>
</body>
</html>
